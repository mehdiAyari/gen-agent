agent:
  name: bank-desk
  description: Helps the customers of the bank check their balance and send transfers
  profile: production
  model:
    provider: ollama
    name: qwen2.5:7b
    temperature: 0
    fallback:
      provider: ollama
      name: qwen2.5:3b
  interface: [ rest, chat-ui ]
  deploy: [ docker-compose, helm ]
  tools:
    - name: account-balance
      type: java
      description: Balance of the account of the signed-in customer, in euros
    - name: send-transfer
      type: java
      description: Sends a transfer from the account of the signed-in customer
      params:
        - { name: iban, type: string, required: true, description: "the IBAN of the recipient, as the customer wrote it" }
        - { name: amount, type: number, required: true, description: "the amount, in euros" }
      approval:
        required: true
