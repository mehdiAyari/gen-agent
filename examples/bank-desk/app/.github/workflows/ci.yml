# Tests on every push, then the evaluations on Ollama: no API key, no cost.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The fake model answers: no provider is called; Testcontainers starts the services in Docker.
      - run: ./mvnw -B verify

  evals:
    needs: test
    runs-on: ubuntu-latest
    env:
      EVALS_MODEL: qwen2.5:7b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache the Ollama models
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5:7b-nomic-embed-text
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service whose models live elsewhere: serve the cached folder instead.
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/.ollama/models" ollama serve > /tmp/ollama.log 2>&1 &
          until curl -s localhost:11434 > /dev/null; do sleep 1; done
          ollama pull qwen2.5:7b
          ollama pull nomic-embed-text
      - run: ./mvnw -B verify -Pevals
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-report
          path: target/evals-report.md
