spring:
  application:
    name: petstore-assistant
  ai:
    ollama:
      chat:
        model: qwen2.5:7b
        temperature: 0

agent:
  system-prompt: classpath:prompts/system.md
  # Where the users are: the model is told the date of the day there.
  time-zone: UTC
  memory:
    window: 20
  tools:
    find-pets-by-status:
      url: https://petstore3.swagger.io/api/v3/pet/findByStatus
      max-response-chars: 20000
    get-pet-by-id:
      url: "https://petstore3.swagger.io/api/v3/pet/{petId}"
      max-response-chars: 20000
