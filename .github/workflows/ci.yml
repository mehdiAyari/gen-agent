name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware linting reads the types the packages build into dist/.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      # The unit tests, with their coverage (packages/*/coverage, lcov for any coverage service).
      - run: pnpm coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage/

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The end-to-end tests lint the Helm charts of the generated projects.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: pnpm install --frozen-lockfile
      # The live tests start agents for real and ask Ollama, with a small model: they check that answers arrive, not
      # how good they are.
      - uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-0.5b-nomic-embed-text
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service whose models live elsewhere: serve the cached folder instead.
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/.ollama/models" ollama serve > /tmp/ollama.log 2>&1 &
          until curl -s localhost:11434 > /dev/null; do sleep 1; done
          ollama pull qwen2.5:0.5b
          ollama pull nomic-embed-text
      # Maven builds of the reference projects, the examples and a pairwise sample of every option (Testcontainers runs
      # in the runner's Docker), a clean room, the live agents, then the web generator in the runner's Google Chrome.
      - run: pnpm e2e
        env:
          LIVE_MODEL: qwen2.5:0.5b
