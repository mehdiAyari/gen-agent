name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware linting reads the types the packages build into dist/.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      # The unit tests, with their coverage (packages/*/coverage, lcov for any coverage service).
      - run: pnpm coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage/

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The end-to-end tests lint the Helm charts of the generated projects.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: pnpm install --frozen-lockfile
      # Maven builds of the reference projects (Testcontainers runs in the runner's Docker), then the web generator in
      # the runner's Google Chrome.
      - run: pnpm e2e
