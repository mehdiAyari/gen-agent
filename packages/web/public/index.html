<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gen-agent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Static hosting has no server-side redirect: the first of the visitor's languages the site has, English otherwise. -->
    <script>
      const supported = (navigator.languages ?? [navigator.language]).find((tag) => /^(en|fr)\b/i.test(tag));
      location.replace(supported?.toLowerCase().startsWith('fr') ? '/fr/' : '/en/');
    </script>
    <meta http-equiv="refresh" content="0; url=/en/" />
  </head>
  <body>
    <a href="/en/">English</a> · <a href="/fr/">Français</a>
  </body>
</html>
