# Standard profile: JDBC memory, OIDC, request and token limits, exact cache, OpenTelemetry and Prometheus, Docker
# Compose, chat page; an authenticated HTTP tool, a Java tool and a sandboxed MCP server and a remote
# one signed with a token.
agent:
  name: support-desk
  description: Answers the customers of the shop, signed in through the shop's identity provider
  profile: standard
  interface: [rest, chat-ui]
  model:
    provider: mistral
    name: mistral-small-latest
  tools:
    - name: order-status
      type: http
      description: Status and delivery date of a customer order
      url: https://shop.example.org/api/orders/{orderId}
      auth: { type: bearer, env: SHOP_API_TOKEN }
      params:
        - { name: orderId, type: string, required: true }
    - name: refund
      type: java
      description: Refunds an order of the customer
      params:
        - { name: orderId, type: string, required: true }
  mcp:
    - name: time
      package: mcp-server-time
      version: 2026.10.19
      runtime: python
    - name: knowledge
      url: https://mcp.example.org/mcp
      auth: { type: bearer, env: KNOWLEDGE_MCP_TOKEN }
