# Production profile: personal data masked and kept 30 days, PII-free logs, erasure endpoints, semantic cache in
# pgvector (V5a); guardrails and limits (V5b1); rules routing, a fallback on Ollama, summaries (V5b2); an HTTP tool that
# gets personal data back in its arguments; a Java tool that waits for the approval of the user, kill switches (V5b3);
# a knowledge base with reranking (V5c).
agent:
  name: vault-desk
  description: Answers bank customers about their transfers
  profile: production
  interface: [rest, chat-ui]
  model:
    provider: mistral
    name: mistral-medium-latest
    routing: { strategy: rules, simple: mistral-small-latest, complex: mistral-medium-latest }
    fallback: { provider: ollama, name: qwen2.5:3b }
  memory:
    summarize: true
  rag:
    enabled: true
    rerank: true
  tools:
    - name: transfer-status
      type: http
      description: Status of the last transfer to an IBAN
      url: https://bank.example.org/api/transfers
      auth: { type: bearer, env: BANK_API_TOKEN }
      cacheTtl: 1m
      params:
        - { name: iban, type: string, required: true }
    - name: block-card
      type: java
      description: Blocks the payment card of the customer
      approval: { required: true, expiresAfter: 1h }
