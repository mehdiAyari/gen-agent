spring:
  application:
    name: hr-assistant
  ai:
    mistralai:
      api-key: ${MISTRAL_API_KEY}
      chat:
        model: mistral-large-latest
        temperature: 0.3
        max-tokens: 2000

agent:
  system-prompt: classpath:prompts/system.md
  # Where the users are: the model is told the date of the day there.
  time-zone: UTC
  memory:
    window: 20
  tools:
    weather-forecast:
      url: https://api.open-meteo.com/v1/forecast
      max-response-chars: 20000
