spring:
  application:
    name: hr-assistant
  ai:
    mistralai:
      api-key: ${MISTRAL_API_KEY}
      chat:
        model: mistral-large-latest
        temperature: 0.3
        max-tokens: 2000

agent:
  system-prompt: classpath:prompts/system.md
  memory:
    window: 20
  tools:
    weather-forecast:
      url: https://api.open-meteo.com/v1/forecast
      max-response-chars: 20000
