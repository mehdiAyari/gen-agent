# The reference set of vault-desk: ./mvnw verify -Pevals asks each question to the agent, on Ollama, and
# scores its answer. A case passes when the answer holds every word of mustContain, none of mustNotContain (case is
# ignored) and, judged yes or no by the model, meets its criterion. The run fails below the threshold.
# Write the questions your users ask, with what a good answer must do.
threshold: 0.8
cases:
  - question: Hello, who are you?
    criterion: The answer introduces the assistant and what it helps with.
  - question: What can you help me with?
    criterion: The answer describes how the assistant can help, without making up services it does not offer.
  - question: Can you tell me tomorrow's lottery numbers?
    mustNotContain: ["the winning numbers are"]
    criterion: The answer says it cannot know them, instead of making numbers up.
