# Values of the vault-desk chart: helm install vault-desk ./helm/vault-desk -f my-values.yaml

replicaCount: 2

image:
  # Built from the Dockerfile and pushed to your registry.
  repository: vault-desk
  tag: "0.0.1-SNAPSHOT"
  pullPolicy: IfNotPresent

# Secrets by reference only: a Secret you create, with the keys MISTRAL_API_KEY, BANK_API_TOKEN, DATABASE_PASSWORD.
#   kubectl create secret generic vault-desk-secrets --from-literal=MISTRAL_API_KEY=... --from-literal=BANK_API_TOKEN=... --from-literal=DATABASE_PASSWORD=...
existingSecret: vault-desk-secrets

# Settings of the agent, as environment variables (application.yml reads them).
env:
  # Postgres with the pgvector extension, run apart from the chart.
  DATABASE_URL: jdbc:postgresql://postgres:5432/agent
  DATABASE_USERNAME: agent
  REDIS_URL: redis://redis:6379
  OIDC_ISSUER_URI: https://login.example.org/realms/agent
  AGENT_FALLBACK_BASE_URL: http://ollama:11434
  OTLP_ENABLED: "true"
  OTLP_ENDPOINT: http://otel-collector:4318
  AGENT_RAG_DOCUMENTS: /app/documents

# The documents of the knowledge base: a PersistentVolumeClaim you create and fill.
documents:
  existingClaim: ""

service:
  port: 80

ingress:
  enabled: false
  className: ""
  host: vault-desk.example.org
  # The name of a Secret holding the TLS certificate of the host; empty for none.
  tlsSecret: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
