spring:
  application:
    name: ticket-bot
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-sonnet-5
        max-tokens: 1024

agent:
  system-prompt: classpath:prompts/system.md
  # Where the users are: the model is told the date of the day there.
  time-zone: UTC
  memory:
    window: 10
  tools:
    create-ticket:
      url: https://tickets.example.org/api/tickets
      token: ${TICKETS_API_TOKEN}
      max-response-chars: 20000
    ticket-status:
      url: "https://tickets.example.org/api/tickets/{ticketId}"
      token: ${TICKETS_API_TOKEN}
      max-response-chars: 4000
    add-comment:
      url: "https://tickets.example.org/api/projects/{project}/tickets/{ticketId}/comments"
      token: ${TICKETS_API_KEY}
      max-response-chars: 20000
    service-status:
      url: https://status.example.org/api/status
      max-response-chars: 20000
