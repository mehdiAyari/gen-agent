agent:
  name: hr-assistant
  description: Internal HR assistant
  profile: production # minimal | standard | production
  java: 21
  build: maven # maven | gradle
  springAi: 1.0.0 # exact version, pinned in the templates

  model:
    provider: mistral # openai | anthropic | mistral | ollama
    name: mistral-large-latest
    temperature: 0.3
    maxTokens: 2000
    routing: # a small model for simple tasks
      strategy: rules # rules (documented heuristics) | classifier
      simple: mistral-small-latest
      complex: mistral-large-latest
    fallback: # must also respect gdpr.euOnly
      provider: ollama
      name: llama3.1

  prompt:
    system: prompts/system.md # a versioned file, never hard-coded
    aiDisclosure: true # tell users they are talking to an AI

  memory:
    type: jdbc # in-memory | jdbc | redis
    window: 20
    summarize: true
    retention: 30d

  tools:
    - name: weather
      type: http
      url: https://api.open-meteo.com/v1/forecast
      cacheTtl: 10m
    - name: book-leave
      type: java
      approval: # human approval
        required: true
        expiresAfter: 24h # cancelled when nobody decides
  openapi:
    - spec: specs/hr-api.yaml
      include: [getLeaves, createLeave]

  mcp:
    - name: filesystem
      package: '@modelcontextprotocol/server-filesystem'
      version: 1.0.0 # exact version required, latest refused
      runtime: node # the container image ships Node
      sandbox: docker

  rag:
    enabled: true
    vectorStore: pgvector
    topK: 4
    rerank: true
    chunkSize: 500

  security:
    auth: oidc
    rateLimit: 30/min
    tokenBudget: 50000/day
    piiMasking: true
    injectionDetection: true

  cache:
    exact: redis
    semantic:
      threshold: 0.95
      scope: user # required: never a cache shared between users

  limits:
    maxIterations: 8
    timeout: 60s

  observability:
    otel: true
    metrics: prometheus
    grafanaDashboard: true
    feedback: true # thumbs up / down buttons linked to traces

  gdpr:
    euOnly: true # consistent: Mistral (EU) first, self-hosted Ollama as fallback
    erasureEndpoint: true
    logsWithoutPii: true

  evals:
    dataset: evals/golden.yaml
    redTeam: true
    ciModel: ollama # no paid calls in CI

  interface: [rest, chat-ui]
  deploy: [docker-compose, helm]
